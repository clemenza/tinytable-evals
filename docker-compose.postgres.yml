# Pinned PostgreSQL backend for oracle.py's --backend postgres (issue #56).
#
# Pinned by version *and* digest, not a floating tag, per #55's acceptance
# criteria - `docker compose up` always starts exactly this image, byte for
# byte, regardless of what "16" currently resolves to on Docker Hub.
#
#   docker compose -f docker-compose.postgres.yml up -d
#   pip install psycopg2-binary   # not a stdlib module - see oracle.py's docstring
#   export PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
#   python3 oracle.py --root clean --backend postgres clean/sql-tests/official
#
# To re-pin to a newer patch release: pick a tag from
# https://hub.docker.com/_/postgres/tags, then resolve its digest with
# (no local docker daemon needed - this hits the registry API directly):
#
#   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull" | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H "Accept: application/vnd.oci.image.index.v1+json" \
#     "https://registry-1.docker.io/v2/library/postgres/manifests/<TAG>" \
#     | grep -i docker-content-digest
#
# then update both the tag comment and the digest below together, and
# re-run selfcheck.py's postgres-oracle check (skipped, not failed, when
# psycopg2/a reachable server aren't available - see selfcheck.py) plus
# oracle.py --backend postgres against clean/sql-tests/official/ to confirm
# the new image still agrees with clean/tinytable before committing the bump.

services:
  postgres:
    # postgres:16.10-bookworm, resolved 2026-08-24
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
    # No volume: this is a disposable oracle, never a data store - every
    # oracle.py run creates and drops its own ephemeral per-file database
    # (see PostgresBackend in oracle.py), and the container itself is
    # thrown away between CI runs.
